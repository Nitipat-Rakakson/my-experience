<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Journal - บันทึกประสบการณ์</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>บันทึกประสบการณ์ของผม</h1>

        <!-- ฟอร์มสร้าง/แก้ไขโพสต์ (ซ่อนไว้ก่อน จะแสดงเมื่อล็อกอินสำเร็จ) -->
        <form id="postForm" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="formTitle">สร้างโพสต์ใหม่</h2>
                <button type="button" id="logoutBtn" style="background: #6b7280; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;">ออกจากระบบ</button>
            </div>
            
            <div class="form-group">
                <label for="title">หัวข้อประสบการณ์</label>
                <input type="text" id="title" placeholder="เช่น ทริปเที่ยวเชียงใหม่..." required>
            </div>

            <div class="form-group">
                <label for="category">หมวดหมู่</label>
                <select id="category">
                    <option value="การแข่งขัน">การแข่งขัน</option>
                    <option value="ค่ายวิชาการ">ค่ายวิชาการ</option>
                    <option value="การอบรม">การอบรม</option>
                    <option value="จิตอาสา">จิตอาสา</option>
                    <option value="ผู้นำ">ผู้นำ</option>
                    <option value="ท่องเที่ยว">ท่องเที่ยว</option>
                    <option value="การเรียน">การเรียน</option>
                    <option value="อาหาร">อาหาร</option>
                    <option value="ทั่วไป">ทั่วไป</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content">เนื้อหา / เรื่องราว</label>
                <textarea id="content" rows="4" placeholder="บอกเล่าเรื่องราวของคุณ..." required></textarea>
            </div>

            <div class="form-group">
                <label for="images">อัปโหลดรูปภาพ</label>
                <input type="file" id="images" accept="image/*" multiple>
            </div>

            <button type="submit" class="primary-btn">เผยแพร่โพสต์</button>
        </form>

        <hr id="formHr" style="display: none;">

        <!-- รายการโพสต์ทั้งหมด -->
        <h2>รายการประสบการณ์ทั้งหมด</h2>
        <div id="cardContainer" class="card-container">
            <p style="text-align:center; color:#78716c;">กำลังโหลดข้อมูล...</p>
        </div>

        <!-- ส่วนเข้าสู่ระบบสำหรับเจ้าของเว็บ (อยู่ท้ายสุด) -->
        <div id="loginSection" style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e7e5e4; text-align: center;">
            <button type="button" id="showLoginBtn" style="background: none; border: none; color: #a8a29e; cursor: pointer; font-size: 12px; text-decoration: underline;">จัดการโพสต์ (สำหรับ Admin)</button>
            <form id="loginForm" style="display: none; max-width: 300px; margin: 15px auto; text-align: left;">
                <div class="form-group">
                    <input type="email" id="adminEmail" placeholder="อีเมล Admin" required>
                </div>
                <div class="form-group">
                    <input type="password" id="adminPassword" placeholder="รหัสผ่าน" required>
                </div>
                <button type="submit" class="primary-btn" style="padding: 8px;">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Modular Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            deleteDoc, 
            updateDoc, 
            doc, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy7NqsHB6l2loPM7DV1tE5p3y9tYM9EIQ",
            authDomain: "my-experience-8953f.firebaseapp.com",
            projectId: "my-experience-8953f",
            storageBucket: "my-experience-8953f.firebasestorage.app",
            messagingSenderId: "518198432976",
            appId: "1:518198432976:web:007a0e6412f2576d5ebad5",
            measurementId: "G-LQ4KBS1390"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.auth = auth;
        window.fb = { 
            collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, orderBy,
            signInWithEmailAndPassword, signOut, onAuthStateChanged
        };
    </script>

    <script src="script.js"></script>
</body>
</html>
