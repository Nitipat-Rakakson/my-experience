<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกประสบการณ์ของฉัน</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- แถบแสดงสถานะผู้ใช้ / ปุ่มเข้าสู่ระบบ -->
        <div class="role-selector">
            <div id="userInfo">
                <strong>สถานะ:</strong> <span id="userDisplay" class="role-badge">ยังไม่ได้เข้าสู่ระบบ</span>
            </div>
            <button type="button" id="authBtn" onclick="openAuthModal()" class="auth-btn">🔑 เข้าสู่ระบบ / สมัครสมาชิก</button>
        </div>

        <h1 id="formTitle">บันทึกประสบการณ์ของฉัน</h1>

        <!-- ส่วนที่ 1: ฟอร์มสำหรับกรอกข้อมูล (จะแสดงเมื่อล็อกอินแล้วเท่านั้น) -->
        <form id="expForm" style="display: none;">
            <div class="form-group">
                <label>หัวข้อประสบการณ์:</label>
                <input type="text" id="title" placeholder="เช่น ไปเดินป่าเขาใหญ่" required>
            </div>

            <div class="form-group">
                <label>หมวดหมู่:</label>
                <select id="category">
                    <option value="การแข่งขัน">การแข่งขัน</option>
                    <option value="ค่ายวิชาการ">ค่ายวิชาการ</option>
                    <option value="การอบรม">การอบรม</option>
                    <option value="การเดินทาง">การเดินทาง</option>
                    <option value="การทำงาน / เรียน">การทำงาน / เรียน</option>
                    <option value="อาหาร / คาเฟ่">อาหาร / คาเฟ่</option>
                    <option value="สถานที่เที่ยว">สถานที่เที่ยว</option>
                </select>
            </div>

            <div class="form-group">
                <label>วันที่:</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label>รายละเอียด:</label>
                <textarea id="detail" rows="4" placeholder="เล่าเรื่องราวความประทับใจ..." required></textarea>
            </div>

            <div class="form-group">
                <label>อัปโหลดรูปภาพ (หากไม่เลือกใหม่จะใช้รูปเดิม):</label>
                <input type="file" id="imageInput" accept="image/*" multiple>
            </div>

            <button type="submit" id="submitBtn">บันทึกประสบการณ์</button>
            <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="cancel-btn" style="display: none;">ยกเลิกการแก้ไข</button>
        </form>

        <p id="loginNotice" style="text-align: center; color: #e74c3c; font-weight: bold;">
            * กรุณาเข้าสู่ระบบเพื่อบันทึกประสบการณ์ใหม่
        </p>

        <hr>

        <!-- ส่วนที่ 2: พื้นที่แสดงรายการประสบการณ์ -->
        <h2>รายการประสบการณ์ทั้งหมด</h2>
        <div id="cardContainer" class="card-container">
            <!-- รายการการ์ดจะถูกเพิ่มด้วย JavaScript -->
        </div>
    </div>

    <!-- Modal หน้าต่างเข้าสู่ระบบ / สมัครสมาชิก -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAuthModal()">&times;</span>
            
            <!-- ฟอร์ม เข้าสู่ระบบ -->
            <div id="loginSection">
                <h2>เข้าสู่ระบบ</h2>
                <div class="form-group">
                    <label>ชื่อผู้ใช้งาน (Username):</label>
                    <input type="text" id="loginUser" placeholder="ใส่ username">
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน (Password):</label>
                    <input type="password" id="loginPass" placeholder="ใส่ password">
                </div>
                <button type="button" onclick="handleLogin()">เข้าสู่ระบบ</button>
                <p class="switch-link">ยังไม่มีบัญชี? <a href="#" onclick="toggleAuthMode('register')">สมัครสมาชิก</a></p>
                <p style="font-size: 12px; color: #7f8c8d; text-align: center;">(บัญชี Admin ทดสอบ: admin / รหัสผ่าน: 1234)</p>
            </div>

            <!-- ฟอร์ม สมัครสมาชิก -->
            <div id="registerSection" style="display: none;">
                <h2>สมัครสมาชิก (User)</h2>
                <div class="form-group">
                    <label>ตั้งชื่อผู้ใช้งาน (Username):</label>
                    <input type="text" id="regUser" placeholder="ตั้ง username">
                </div>
                <div class="form-group">
                    <label>ตั้งรหัสผ่าน (Password):</label>
                    <input type="password" id="regPass" placeholder="ตั้ง password">
                </div>
                <button type="button" onclick="handleRegister()">สมัครสมาชิก</button>
                <p class="switch-link">มีบัญชีอยู่แล้ว? <a href="#" onclick="toggleAuthMode('login')">เข้าสู่ระบบ</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
